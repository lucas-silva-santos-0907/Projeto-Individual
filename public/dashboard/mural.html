<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaTech | Mural</title>

    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/estilo.css" />
    <script src="../js/sessao.js"></script>
    <script src="./../js/alerta.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body onload="validarSessao(), atualizarFeed()" style="background-color: #161618;">

    <div class="janela">
        <div class="dash">
            <div class="header-BMO">
                <div class="hello">
                    <h2>MURAL</h2>
                    <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
                </div>
                <div class="foto-perfil">
                    <img src="../assets/imgss/finn icon.jpg" alt="Foto de Perfil">
                </div>
            </div>

            <div class="dash-right">
                <div class="mural">
                    <div id="alerta"></div>
                    <div class="mural-header">
                        <div>
                            <h1>MURAL</h1>
                            <p>Compartilhe suas aventuras em Ooo!</p>
                        </div>
                        <div class="mural-avatar">
                            <img src="../assets/imgss/BMO.jpg" alt="Avatar" />
                        </div>
                    </div>

                    <div class="mural-form">
                        <div class="mural-form-title">O que está acontecendo, aventureiro?</div>
                        <form id="form_postagem" method="post" onsubmit="return publicar()">
                            <textarea name="descricao" id="textarea_descricao" maxlength="250"
                                placeholder="Escreva algo para compartilhar com a comunidade..."></textarea>
                            <div class="mural-form-footer">
                                <span>Compartilhe suas ideias!</span>
                                <button class="mural-button" type="submit">PUBLICAR</button>
                            </div>
                        </form>
                    </div>

                    <div class="mural-feed">
                        <div class="mural-feed-header">
                            <h2>Publicações recentes</h2>
                            <span id="feed_status" class="mural-feed-status"></span>
                        </div>
                        <div id="feed_container" class="feed-container"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="graficos"></div>
    </div>

    <div class="footer-dash">
        <div class="container">
            <div>
                <a href="./dashboard.html" class="btn-sla">
                    <h3>Principal</h3>
                </a>
            </div>

            <div>
                <a href="./quiz.html" class="btn-sla-pers">
                    <h3>Quiz de Personalidade</h3>
                </a>
            </div>

            <div>
                <a href="./mural.html" class="btn-sla">
                    <h3>Mural</h3>
                </a>
            </div>

            <div>
                <a href="./mural.html" class="btn-sla">
                    <h3>Perfil</h3>
                </a>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>
        </div>
    </div>

    <script>
        var formPostagem = document.getElementById("form_postagem");
        var feedContainer = document.getElementById("feed_container");
        var feedStatus = document.getElementById("feed_status");

        function limparFormulario() {
            formPostagem.reset();
        }

        function publicar() {
            var idUsuario = sessionStorage.ID_USUARIO;
            var conteudo = formPostagem.descricao.value.trim();

            if (!conteudo) {
                window.alert("Escreva algo antes de publicar!");
                return false;
            }

            if (!idUsuario) {
                window.alert("Sua sessão expirou. Faça login novamente.");
                return false;
            }

            var corpo = { conteudo: conteudo };

            fetch(`/mural/publicar/${idUsuario}`, {
                method: "post",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(corpo)
            }).then(function (resposta) {
                if (resposta.ok) {
                    window.alert("Post realizado com sucesso!");
                    limparFormulario();
                    atualizarFeed();
                } else {
                    return resposta.text().then(function (texto) { throw texto; });
                }
            }).catch(function (erro) {
                console.log("#ERRO: ", erro);
                window.alert("Não foi possível publicar. Tente novamente.");
            });

            return false;
        }

        function atualizarFeed() {
            var idUsuario = sessionStorage.ID_USUARIO || 0;
            feedStatus.textContent = "Carregando publicações...";
            fetch(`/mural/listar/${idUsuario}`, { cache: 'no-store' })
                .then(function (resposta) {
                    if (resposta.status == 204) {
                        feedContainer.innerHTML = `<span class="mural-empty">Nenhuma publicação encontrada.</span>`;
                        feedStatus.textContent = "";
                        return [];
                    }
                    if (!resposta.ok) {
                        throw `Erro ao carregar o mural (${resposta.status})`;
                    }
                    return resposta.json();
                })
                .then(function (publicacoes) {
                    feedContainer.innerHTML = "";
                    if (!publicacoes || publicacoes.length === 0) {
                        feedContainer.innerHTML = `<span class="mural-empty">Nenhuma publicação encontrada.</span>`;
                        feedStatus.textContent = "";
                        return;
                    }

                    publicacoes.forEach(function (publicacao) {
                        feedContainer.appendChild(criarCard(publicacao));
                    });
                    feedStatus.textContent = "";
                })
                .catch(function (erro) {
                    feedContainer.innerHTML = `<span class="mural-empty">Não foi possível carregar o mural.</span>`;
                    feedStatus.textContent = "";
                    console.error(erro);
                });
        }

        function criarCard(publicacao) {
            var card = document.createElement("article");
            card.className = "mural-card";

            var header = document.createElement("div");
            header.className = "mural-card-header";

            var avatar = document.createElement("img");
            avatar.className = "mural-avatar-small";
            avatar.src = "../assets/imgss/finn icon.jpg";
            avatar.alt = "Avatar";

            var authorInfo = document.createElement("div");
            var horario = formatarHorario(publicacao.dtPublicacao);
            authorInfo.innerHTML = `<span class='mural-author'>${publicacao.nome}</span><br><small>${horario}</small>`;

            header.appendChild(avatar);
            header.appendChild(authorInfo);

            var body = document.createElement("div");
            body.className = "mural-card-body";
            var texto = document.createElement("p");
            texto.textContent = publicacao.conteudo;
            body.appendChild(texto);

            var actions = document.createElement("div");
            actions.className = "mural-card-actions";

            var likeButton = document.createElement("button");
            likeButton.type = "button";
            likeButton.className = publicacao.curtidoPorMim ? "mural-action-button mural-action-button--active" : "mural-action-button";
            likeButton.textContent = publicacao.curtidoPorMim ? "Descurtir" : "Curtir";
            likeButton.onclick = function () {
                toggleCurtida(publicacao);
            };

            var likeCount = document.createElement("span");
            likeCount.className = "mural-like-count";
            var totalCurtidas = publicacao.totalCurtidas || 0;
            likeCount.textContent = `${totalCurtidas} curtida${totalCurtidas === 1 ? "" : "s"}`;

            actions.appendChild(likeButton);
            actions.appendChild(likeCount);

            var deleteButton = document.createElement("button");
            deleteButton.type = "button";
            deleteButton.className = "mural-action-button mural-action-button--danger";
            deleteButton.textContent = "Excluir";
            deleteButton.onclick = function () {
                deletarMural(publicacao.idMural);
            };
            actions.appendChild(deleteButton);

            var comments = document.createElement("div");
            comments.className = "mural-card-comments";
            comments.appendChild(criarListaComentarios(publicacao.comentarios));

            var commentForm = document.createElement("form");
            commentForm.className = "mural-comment-form";
            commentForm.onsubmit = function (evento) {
                return comentarMural(evento, publicacao.idMural);
            };

            var textArea = document.createElement("textarea");
            textArea.name = "comentario";
            textArea.placeholder = "Escreva um comentário...";
            textArea.maxLength = 250;

            var commentButton = document.createElement("button");
            commentButton.type = "submit";
            commentButton.className = "mural-comment-btn";
            commentButton.textContent = "Comentar";

            commentForm.appendChild(textArea);
            commentForm.appendChild(commentButton);
            comments.appendChild(commentForm);

            card.appendChild(header);
            card.appendChild(body);
            card.appendChild(actions);
            card.appendChild(comments);

            return card;
        }

        function criarListaComentarios(comentarios) {
            var wrapper = document.createElement("div");
            wrapper.className = "mural-comments-list";

            if (!comentarios || comentarios.length === 0) {
                var aviso = document.createElement("span");
                aviso.className = "mural-comment-empty";
                aviso.textContent = "Seja o primeiro a comentar!";
                wrapper.appendChild(aviso);
                return wrapper;
            }

            comentarios.forEach(function (comentario) {
                var item = document.createElement("div");
                item.className = "mural-comment";

                var autor = document.createElement("strong");
                autor.textContent = comentario.nomeUsuario;

                var texto = document.createElement("p");
                texto.textContent = comentario.conteudo;

                var data = document.createElement("small");
                data.className = "mural-comment-date";
                data.textContent = formatarHorario(comentario.dtComentario);

                item.appendChild(autor);
                item.appendChild(texto);
                item.appendChild(data);
                wrapper.appendChild(item);
            });

            return wrapper;
        }

        function formatarHorario(valor) {
            if (!valor) return "";
            var data = new Date(valor);
            return data.toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" });
        }

        function toggleCurtida(publicacao) {
            var idUsuario = sessionStorage.ID_USUARIO;
            if (!idUsuario) {
                window.alert("Faça login novamente para curtir");
                return;
            }

            var endpoint = publicacao.curtidoPorMim ? `/mural/descurtir/${publicacao.idMural}/${idUsuario}` : `/mural/curtir/${publicacao.idMural}/${idUsuario}`;

            fetch(endpoint, {
                method: "post",
                headers: {
                    "Content-Type": "application/json"
                }
            }).then(function (resposta) {
                if (resposta.ok) {
                    atualizarFeed();
                } else {
                    return resposta.text().then(function (texto) { throw texto; });
                }
            }).catch(function (erro) {
                console.error(erro);
                window.alert("Não foi possível atualizar a curtida.");
            });
        }

        function deletarMural(idMural) {
            var idUsuario = sessionStorage.ID_USUARIO;
            if (!idUsuario) {
                window.alert("Faça login novamente para excluir o post.");
                return;
            }

            if (!confirm("Deseja realmente excluir essa publicação?")) {
                return;
            }

            fetch(`/mural/deletar/${idMural}/${idUsuario}`, {
                method: "DELETE"
            }).then(function (resposta) {
                if (resposta.ok) {
                    window.alert("Publicação removida com sucesso.");
                    atualizarFeed();
                } else {
                    return resposta.text().then(function (texto) { throw texto; });
                }
            }).catch(function (erro) {
                console.error(erro);
                window.alert("Não foi possível excluir a publicação.");
            });
        }

        function comentarMural(evento, idMural) {
            evento.preventDefault();
            var idUsuario = sessionStorage.ID_USUARIO;
            var textArea = evento.target.querySelector("textarea");
            var conteudo = textArea.value.trim();

            if (!conteudo) {
                window.alert("Escreva algo antes de comentar!");
                return false;
            }

            if (!idUsuario) {
                window.alert("Faça login novamente para comentar");
                return false;
            }

            fetch(`/mural/comentar/${idMural}/${idUsuario}`, {
                method: "post",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ conteudo: conteudo })
            }).then(function (resposta) {
                if (resposta.ok) {
                    textArea.value = "";
                    atualizarFeed();
                } else {
                    return resposta.text().then(function (texto) { throw texto; });
                }
            }).catch(function (erro) {
                console.error(erro);
                window.alert("Não foi possível enviar o comentário.");
            });

            return false;
        }
    </script>

</body>

</html>
