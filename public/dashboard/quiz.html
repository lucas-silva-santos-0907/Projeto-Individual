<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../assets/icon/prismoicon.jpg" type="image/x-icon">

    <title>Quiz de Personalidade</title>
    <link rel="stylesheet" href="../css/dashboards.css">
    <script src="../js/sessao.js"></script> 
</head>


<body onload="onloadEsconder(), validarSessao(), atualizarFeed()">


    <div class="janela">
        <div class="dash">

            <div class="header-BMO">
                <div class="hello">
                    <h2>Quiz de Personalidade</h2>
                    <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
                </div>
                <div class="foto-perfil">
                    <img src="../assets/imgss/finn icon.jpg" alt="Foto de Perfil">
                </div>

            </div>


            <div class="quiz">
                <div id="pontuacaoEJogo" class="quiz-box">
                    <button id="btnIniciarQuiz" onclick="iniciarQuiz()">INICIAR QUIZ</button>

                    <div id="pontuacao" class="flex-colunar width-fit-content border-primary">
                        <div id="pontuacaoDuranteJogo" class="flex-colunar padding-8">
                            <span class="width-fit-content">Quantidade de acertos: <span id="spanCertas"></span></span>
                            <span class="width-fit-content">Quantidade de erros: <span id="spanErradas"></span></span>
                        </div>
                        <div id="pontuacaoFinalJogo" class="flex-colunar padding-8">
                            <span id="pontuacaoFinal" class="width-fit-content">Pontuação Final:
                                <span id="spanPontuacaoFinal">***</span>
                            </span>
                            <span id="msgFinal" class="width-fit-content">***</span>
                        </div>
                    </div>

                    <div id="jogo" class="width-fit-content flex-colunar border-secondary">

                        <div id="infoQuestao" class="padding-8">
                            <span>Questão atual: <span id="spanNumeroDaQuestaoAtual"></span> de <span
                                    id="qtdQuestoes"></span>
                                questões.</span>
                        </div>

                        <div id="perguntaDaQuestaoAtual" class="padding-8">
                            <span id="spanQuestaoExibida" class="text-bold"></span>
                        </div>

                        <div id="infoAlternativas" class="padding-8">
                            <span><em>Escolha uma opção dentre as abaixo:</em></span>
                        </div>

                        <div id="opcoes" class="flex-colunar padding-8 questoes">
                            <span>
                                <input type="radio" id="primeiraOpcao" name="option" class="radio"
                                    value="alternativaA" />
                                <label for="primeiraOpcao" class="option" id="labelOpcaoUm"></label>
                            </span>
                            <span>
                                <input type="radio" id="segundaOpcao" name="option" class="radio"
                                    value="alternativaB" />
                                <label for="segundaOpcao" class="option" id="labelOpcaoDois"></label>
                            </span>
                            <span>
                                <input type="radio" id="terceiraOpcao" name="option" class="radio"
                                    value="alternativaC" />
                                <label for="terceiraOpcao" class="option" id="labelOpcaoTres"></label>
                            </span>
                            <span>
                                <input type="radio" id="quartaOpcao" name="option" class="radio" value="alternativaD" />
                                <label for="quartaOpcao" class="option" id="labelOpcaoQuatro"></label>
                            </span>
                            <span>
                                <input type="radio" id="quintaOpcao" name="option" class="radio" value="alternativaE" />
                                <label for="quintaOpcao" class="option" id="labelOpcaoCinco"></label>
                            </span>
                        </div>

                        <div id="botoes" class="flex-colunar padding-8">
                            <button onclick="submeter()" id="btnSubmeter">Submeter resposta</button>
                            <button onclick="tentarNovamente()" id="btnTentarNovamente" disabled>Tentar
                                novamente</button>
                        </div>

                    </div>
                </div>

                <div id="resultadoFinal" class="resultado-final flex-colunar padding-16" style="display:none;">
                    <img id="imgPersonagem" src="" alt="Personagem"
                        style="max-width:250px; border-radius:16px; box-shadow:0 10px 25px rgba(0,0,0,0.2);" />
                    <h3 id="nomePersonagem" style="margin-top:16px; text-transform:uppercase; letter-spacing:1px;"></h3>
                    <p id="descricaoPersonagem"
                        style="margin-top:12px; text-align:center; max-width:360px; line-height:1.5;"></p>
                </div>
            </div>

            <div id="alerta">

            </div>

            <div id="graficos">
            </div>
        </div>
    </div>

    <div class="footer-dash">
        <div class="container">

            <div>
                <a href="./dashboard.html" class="btn-sla">
                    <h3>Principal</h3>
                </a>
            </div>

            <div>
                <a href="./quiz.html" class="btn-sla-pers">
                    <h3>Quiz de Personalidade</h3>
                </a>
            </div>


            <div>
                <a href="./mural.html" class="btn-sla">
                    <h3>Mural</h3>
                </a>
            </div>

            <!-- <div>
                <a href="./mural.html" class="btn-sla">
                    <h3>Perfil</h3>
                </a>
            </div> -->

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>

        </div>
    </div>
</body>

</html>

<script src="../js/personagens.js"></script>

<script>
    const listaDeQuestoes = [
        {
            pergunta: "Quando um amigo precisa desabafar sobre problemas em casa, você:",
            alternativas: {
                alternativaA: { texto: "Escuta, oferece companhia e reafirma que ele não está sozinho", personagem: "Finn"},
                alternativaB: { texto: "Joga frases leves, conta histórias engraçadas e descontrai o espaço", personagem: "Jake" },
                alternativaC: { texto: "Organiza um plano simples, divide tarefas e traz segurança emocional", personagem: "Princesa Jujuba" },
                alternativaD: { texto: "Compartilha sentimentos por meio da arte e cria intimidade emocional", personagem: "Marceline" },
                alternativaE: { texto: "Analisa o que pode ser feito e oferece soluções estruturadas", personagem: "Rei Gelado/Simon Petrikov" }
            }
        },
        {
            pergunta: "Como você lida com pressão de várias tarefas no mesmo dia?",
            alternativas: {
                alternativaA: { texto: "Faço listas claras, priorizo e organizo cada etapa com calma", personagem: "Princesa Jujuba" },
                alternativaB: { texto: "Intercalo tarefas com pausas criativas e mantenho o bom humor", personagem: "Jake" },
                alternativaC: { texto: "Encaro cada desafio com coragem e foco para concluir um a um", personagem: "Finn" },
                alternativaD: { texto: "Transformo tudo em um desafio divertido para manter o otimismo", personagem: "BMO" },
                alternativaE: { texto: "Reúno dados do que já funcionou e redefino prioridades com lógica", personagem: "Rei Gelado/Simon Petrikov" }
            }
        },
        {
            pergunta: "Quando percebe que alguém está espalhando boatos ou informações falsas, você:",
            alternativas: {
                alternativaA: { texto: "Tenta apoiar emocionalmente quem foi afetado", personagem: "Finn" },
                alternativaB: { texto: "Usa humor para aliviar a pressão e lembrar que tudo passa", personagem: "Jake" },
                alternativaC: { texto: "Organiza os fatos, busca fontes confiáveis e expõe a verdade", personagem: "Princesa Jujuba" },
                alternativaD: { texto: "Cria algo artístico para transformar o momento em reflexão", personagem: "Marceline" },
                alternativaE: { texto: "Investiga dados e compartilha uma resposta estruturada com evidências", personagem: "Rei Gelado/Simon Petrikov" }
            }
        },
        {
            pergunta: "O evento com amigos está desorganizado, com conflitos e decisões difíceis; como age?",
            alternativas: {
                alternativaA: { texto: "Sugiro algo divertido e improviso um plano flexível", personagem: "Jake" },
                alternativaB: { texto: "Uso listas e tecnologia para reunir ideias e organizar o fluxo", personagem: "BMO" },
                alternativaC: { texto: "Reúno todo mundo, explico prioridades e aplico estratégia", personagem: "Princesa Jujuba" },
                alternativaD: { texto: "Faço uma trilha, mantenho o espírito aventureiro e cuido da coragem geral", personagem: "Finn" },
                alternativaE: { texto: "Analiso o que deu errado e defino limites para proteger o grupo", personagem: "Rei Gelado/Simon Petrikov" }
            }
        },
        {
            pergunta: "No tempo livre, o que mais te recarrega?",
            alternativas: {
                alternativaA: { texto: "Passar tempo na natureza, praticar esportes e respirar ar livre", personagem: "Finn" },
                alternativaB: { texto: "Criar música, escrever ou desenhar e processar emoções profundas", personagem: "Marceline" },
                alternativaC: { texto: "Desenhar experimentos, jogos e compartilhar descobertas divertidas", personagem: "BMO" },
                alternativaD: { texto: "Conversar, rir e manter o grupo unido com brincadeiras espontâneas", personagem: "Jake" },
                alternativaE: { texto: "Organizar o tempo e cuidar das tarefas com precisão e disciplina", personagem: "Rei Gelado/Simon Petrikov" }
            }
        },
        {
            pergunta: "Como ajuda um amigo que perdeu a motivação?",
            alternativas: {
                alternativaA: { texto: "Escuto, valido sentimentos e fico presente para apoiá-lo", personagem: "Finn" },
                alternativaB: { texto: "Levo leveza, boas memórias e planos engraçados para levantar o astral", personagem: "Jake" },
                alternativaC: { texto: "Ajudo a montar metas práticas, cronogramas e apoio emocional", personagem: "Princesa Jujuba" },
                alternativaD: { texto: "Crio algo artístico ou divertido para lembrar quem ele é", personagem: "Marceline" },
                alternativaE: { texto: "Apresento dados e pequenos passos para recuperar o ritmo com lógica", personagem: "Rei Gelado/Simon Petrikov" }
            }
        },
        {
            pergunta: "O que faz você se sentir útil em um grupo?",
            alternativas: {
                alternativaA: { texto: "Apoiar os outros com coragem e proteção", personagem: "Finn" },
                alternativaB: { texto: "Planejar soluções e manter o equilíbrio emocional", personagem: "Princesa Jujuba" },
                alternativaC: { texto: "Trazer humor e espontaneidade para aproximar as pessoas", personagem: "Jake" },
                alternativaD: { texto: "Apresentar ideias curiosas e manter a energia positiva", personagem: "BMO" },
                alternativaE: { texto: "Apresentar estratégias sólidas para cuidar de todos", personagem: "Rei Gelado/Simon Petrikov" }
            }
        },
        {
            pergunta: "Ao tomar uma decisão rápida, você prefere:",
            alternativas: {
                alternativaA: { texto: "Seguir a intuição e agir com bravura", personagem: "Finn" },
                alternativaB: { texto: "Buscar evidências e lógica antes de agir", personagem: "Rei Gelado/Simon Petrikov" },
                alternativaC: { texto: "Conversar com o grupo para alinhar a melhor saída", personagem: "Princesa Jujuba" },
                alternativaD: { texto: "Transformar o processo em experimentos e testar possibilidades", personagem: "BMO" },
                alternativaE: { texto: "Explorar como se sente e perceber as sensações do corpo", personagem: "Marceline" }
            }
        },
        {
            pergunta: "Qual cenário torna seu dia mais significativo?",
            alternativas: {
                alternativaA: { texto: "Fazer algo pelo outro e garantir que ele se sinta seguro", personagem: "Finn" },
                alternativaB: { texto: "Organizar tudo nos bastidores e trazer paz coletiva", personagem: "Princesa Jujuba" },
                alternativaC: { texto: "Criar arte, música ou histórias emocionantes", personagem: "Marceline" },
                alternativaD: { texto: "Inventar novas histórias, jogos e experiências coletivas", personagem: "BMO" },
                alternativaE: { texto: "Relembrar conquistas, proteger o próximo e planejar o futuro", personagem: "Rei Gelado/Simon Petrikov" }
            }
        },
        {
            pergunta: "Quando a ansiedade aparece à noite, você:",
            alternativas: {
                alternativaA: { texto: "Conversa com alguém e busca força na amizade", personagem: "Finn" },
                alternativaB: { texto: "Organiza pensamentos e coloca ordem nas ideias", personagem: "Princesa Jujuba" },
                alternativaC: { texto: "Desce sentimentos em letras, melodias ou desenhos", personagem: "Marceline" },
                alternativaD: { texto: "Transforma tudo em brincadeira e aprendizado", personagem: "BMO" },
                alternativaE: { texto: "Investiga o que é preciso desacelerar para proteger a si e aos outros", personagem: "Rei Gelado/Simon Petrikov" }
            }
        }
    ]
        
        const idsPersonagens = {
        "Finn": 1,
        "Jake": 2,
        "BMO": 3,
        "Princesa Jujuba": 4,
        "Marceline": 5,
        "Rei Gelado/Simon Petrikov": 6
    };

    const descricoesPersonagens = {
        "Finn": "Você assume a liderança com coragem e lealdade, defendendo quem precisa e transformando desafios em oportunidades para proteger os outros. Essa transparência emocional inspira confiança, fazendo o grupo se sentir amparado como no Finn que sempre enfrenta o desconhecido.",
        "Jake": "Você mistura leveza, criatividade e flexibilidade para dissolver tensões e manter o ambiente acolhedor. Sua empatia prática faz as pessoas rirem, se sentirem confortáveis e enxergar o cotidiano com otimismo contagiante.",
        "Princesa Jujuba": "Você resolve problemas complexos com planejamento preciso e empatia verdadeira, cuidando da comunidade com lógica estratégica e calor humano. Sua voz firme transmite segurança, enquanto o coração generoso acolhe sentimentos, exatamente como a Princesa Jujuba que governa com sabedoria e carinho.",
        "Marceline": "Você expressa emoções de forma intensa através da arte, acolhendo dores alheias e traduzindo-as em afirmações autênticas. O modo sincero como você toca as pessoas transforma qualquer momento em uma jornada emocional compartilhada.",
        "BMO": "Você transforma situações cotidianas em descobertas inventivas e está sempre pronto para aprender algo novo e dividir com o grupo. Sua curiosidade divertida cria conexões e mantém a energia otimista mesmo nos dias mais difíceis.",
        "Rei Gelado/Simon Petrikov": "Você busca entender histórias profundas, usa o raciocínio lógico para proteger o que importa e aprende com os próprios momentos obscuros. Sua maturidade sensível mostra que o cuidado real envolve responsabilidade e a coragem de enfrentar sombras internas."
    }

    const imagensPersonagens = {
        "Finn": "../assets/imgss/Finn.jpg",
        "Jake": "../assets/imgss/Jake.jpg",
        "Princesa Jujuba": "../assets/imgss/av1.png",
        "Marceline": "../assets/imgss/Marceline.jpg",
        "BMO": "../assets/imgss/BMO.jpg",
        "Rei Gelado/Simon Petrikov": "../assets/imgss/av2.png"
    }

    const personagens = Object.keys(descricoesPersonagens)
    let pontuacoes = {}
    let numeroDaQuestaoAtual = 0
    let respondidas = 0
    const quantidadeDeQuestoes = listaDeQuestoes.length
    const btnIniciar = document.getElementById('btnIniciarQuiz')
    const btnSubmeter = document.getElementById('btnSubmeter')
    const btnTentarNovamente = document.getElementById('btnTentarNovamente')
    const quintaOpcao = document.getElementById('quintaOpcao')
    const areaQuiz = document.getElementById('pontuacaoEJogo')
    const jogoContainer = document.getElementById('jogo')
    const resultadoContainer = document.getElementById('resultadoFinal')
    const imgPersonagem = document.getElementById('imgPersonagem')
    const nomePersonagem = document.getElementById('nomePersonagem')
    const descricaoPersonagem = document.getElementById('descricaoPersonagem')
    const containerPontuacao = document.getElementById('pontuacao')

    function onloadEsconder() {
        containerPontuacao.style.display = "none"
        jogoContainer.style.display = "none"
        resultadoContainer.style.display = "none"
    }

    function iniciarQuiz() {
        btnIniciar.style.display = "none"
        containerPontuacao.style.display = "none"
        resultadoContainer.style.display = "none"
        jogoContainer.style.display = "flex"
        areaQuiz.style.display = "flex"
        document.getElementById('qtdQuestoes').innerHTML = quantidadeDeQuestoes
        reiniciarPontuacoes()
        respondidas = 0
        numeroDaQuestaoAtual = 0
        desmarcarRadioButtons()
        limparCoresBackgroundOpcoes()
        preencherHTMLcomQuestaoAtual(numeroDaQuestaoAtual)
        habilitarAlternativas(true)
        btnSubmeter.disabled = false
        btnTentarNovamente.disabled = true
    }

    function preencherHTMLcomQuestaoAtual(index) {
        const questaoAtual = listaDeQuestoes[index]
        numeroDaQuestaoAtual = index
        document.getElementById("spanNumeroDaQuestaoAtual").innerHTML = Number(index) + 1
        document.getElementById("spanQuestaoExibida").innerHTML = questaoAtual.pergunta
        document.getElementById("labelOpcaoUm").innerHTML = questaoAtual.alternativas.alternativaA.texto
        document.getElementById("labelOpcaoDois").innerHTML = questaoAtual.alternativas.alternativaB.texto
        document.getElementById("labelOpcaoTres").innerHTML = questaoAtual.alternativas.alternativaC.texto
        document.getElementById("labelOpcaoQuatro").innerHTML = questaoAtual.alternativas.alternativaD.texto
        document.getElementById("labelOpcaoCinco").innerHTML = questaoAtual.alternativas.alternativaE.texto
    }

    function submeter() {
        const options = Array.from(document.getElementsByName("option"))
        const selecionada = options.find(option => option.checked)
        if (!selecionada) {
            alert("Escolha uma alternativa antes de continuar.")
            return
        }
        btnSubmeter.disabled = true
        habilitarAlternativas(false)
        registrarResposta(selecionada.value)
        prepararProximoPasso()
    }

    function registrarResposta(valorSelecionado) {
        const questaoAtual = listaDeQuestoes[numeroDaQuestaoAtual]
        const alternativa = questaoAtual.alternativas[valorSelecionado]
        if (!alternativa) {
            return
        }
        pontuacoes[alternativa.personagem] += 1
        respondidas += 1
        numeroDaQuestaoAtual += 1
    }

    function prepararProximoPasso() {
        limparCoresBackgroundOpcoes()
        desmarcarRadioButtons()
        if (respondidas >= quantidadeDeQuestoes) {
            finalizarJogo()
            return
        }
        preencherHTMLcomQuestaoAtual(numeroDaQuestaoAtual)
        habilitarAlternativas(true)
        btnSubmeter.disabled = false
    }

    function habilitarAlternativas(liberar) {
        const desabilitar = liberar ? false : true
        primeiraOpcao.disabled = desabilitar
        segundaOpcao.disabled = desabilitar
        terceiraOpcao.disabled = desabilitar
        quartaOpcao.disabled = desabilitar
        quintaOpcao.disabled = desabilitar
    }

    function tentarNovamente() {
        window.location.reload()
    }

    function finalizarJogo() {
        const resultado = obterPersonagemComMaiorPontuacao()
        const personagemId = idsPersonagens[resultado.nome];
    const payload = {
    fkUsuario: Number(sessionStorage.ID_USUARIO),
    fkPersonagem: personagemId
    };

    console.log(payload);

        
fetch("/quiz/cadastrar", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify(payload)
})
  .then(response => {
    if (!response.ok) return response.text().then(text => { throw new Error(text) });
    return response.text();
  })
  .then(() => console.log("Quiz salvo com sucesso"))
  .catch(error => console.error("Erro ao salvar quiz:", error));


        const descricao = descricoesPersonagens[resultado.nome]
        const imagem = imagensPersonagens[resultado.nome] || "../assets/imgss/Logo.png"
        btnIniciar.style.display = "none"
        jogoContainer.style.display = "none"
        areaQuiz.style.display = "none"
        resultadoContainer.style.display = "flex"
        nomePersonagem.textContent = resultado.nome
        descricaoPersonagem.textContent = descricao
        imgPersonagem.src = imagem
        imgPersonagem.alt = resultado.nome
        btnSubmeter.disabled = true
        btnTentarNovamente.disabled = false
    }

    function obterPersonagemComMaiorPontuacao() {
        const entradas = Object.entries(pontuacoes)
        entradas.sort((a, b) => b[1] - a[1])
        const maiorPontuacao = entradas[0][1]
        const empatados = entradas.filter(([_, pontos]) => pontos === maiorPontuacao)
        return { nome: empatados[0][0], pontos: maiorPontuacao }
    }

    function reiniciarPontuacoes() {
        pontuacoes = {}
        personagens.forEach(personagem => {
            pontuacoes[personagem] = 0
        })
    }

    function desmarcarRadioButtons() {
        const options = document.getElementsByName("option")
        for (let i = 0; i < options.length; i++) {
            options[i].checked = false
        }
    }

    function limparCoresBackgroundOpcoes() {
        const options = document.getElementsByName("option")
        options.forEach((option) => {
            if (option.labels && option.labels[0]) {
                option.labels[0].classList.remove("text-danger-with-bg")
                option.labels[0].classList.remove("text-success-with-bg")
            }
        })
    }
</script>
